name: Release

on:
  # Publishing on every merge to main, rather than only when somebody remembers to press
  # the button. Three separate fixes in a row shipped as "merged, but not actually
  # published", because the merge and the publish were different actions and only one of
  # them was automatic. The repository has one consumer - the plugin listing - and it should
  # always describe the newest build on main.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # No explicit ref: build whatever branch or tag the run was started from, so the
      # branch picker in the Actions tab does what it looks like it does.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch Dalamud dev libraries
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath dalamud -Force
        shell: pwsh

      # Dalamud.NET.Sdk resolves its reference assemblies from the XIVLauncher hooks path
      # by default, which is where they live on a real install.
      - name: Stage Dalamud where the SDK looks for it
        shell: pwsh
        run: |
          $hooks = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $hooks | Out-Null
          Copy-Item dalamud/* $hooks -Recurse -Force

      - name: Build
        run: dotnet build src/OneTwoPunch.Plugin/OneTwoPunch.Plugin.csproj -c Release

      # DalamudPackager fills in AssemblyVersion; the API level is overridden below with
      # the value read off the assembly, because the packager stamps its own.
      # Dalamud computes its own API level as the major version of Dalamud.dll:
      #
      #     DalamudApiLevel = typeof(PluginManager).Assembly.GetName().Version!.Major;
      #
      # and the installer only lists a plugin whose level matches exactly. DalamudPackager
      # stamps the level it was itself built against - 10, against a Dalamud 15 - so the
      # first release published a listing the installer silently discarded. Read the real
      # number off the assembly instead.
      - name: Read Dalamud API level
        id: apilevel
        shell: pwsh
        run: |
          $dll = Join-Path $PWD "dalamud/Dalamud.dll"
          $version = [System.Reflection.AssemblyName]::GetAssemblyName($dll).Version
          if (-not $version) { throw "Could not read a version from Dalamud.dll" }

          $level = $version.Major
          Write-Host "Dalamud.dll version $version -> API level $level"
          if ($level -lt 1) { throw "Implausible API level $level - refusing to publish a listing the installer would hide" }

          "level=$level" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # DalamudPackager also writes the API level into the manifest it packages *inside*
      # latest.zip, and Dalamud checks that one when loading an installed plugin - a stale
      # value there means the plugin lists in the installer and then refuses to load, which
      # is an even more confusing failure than not listing at all. Correct both copies.
      - name: Stamp the API level into the packaged manifest
        shell: pwsh
        run: |
          $level = [int]"${{ steps.apilevel.outputs.level }}"
          $zip = Get-ChildItem src/OneTwoPunch.Plugin/bin -Recurse -Filter latest.zip | Select-Object -First 1
          if (-not $zip) { throw "DalamudPackager produced no latest.zip" }

          # The loose manifests beside the build output.
          Get-ChildItem src/OneTwoPunch.Plugin/bin -Recurse -Filter OneTwoPunch.json | ForEach-Object {
            $m = Get-Content $_.FullName -Raw | ConvertFrom-Json
            $m | Add-Member -NotePropertyName DalamudApiLevel -NotePropertyValue $level -Force
            $m | ConvertTo-Json -Depth 10 | Set-Content $_.FullName -Encoding utf8
            Write-Host "stamped $($_.FullName)"
          }

          # And the copy sealed inside the zip, which is the one that actually ships.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open($zip.FullName, 'Update')
          try {
            $entry = $archive.Entries | Where-Object { $_.Name -eq 'OneTwoPunch.json' } | Select-Object -First 1
            if (-not $entry) { throw "latest.zip contains no OneTwoPunch.json" }

            $reader = New-Object System.IO.StreamReader($entry.Open())
            $json = $reader.ReadToEnd()
            $reader.Dispose()

            $m = $json | ConvertFrom-Json
            $m | Add-Member -NotePropertyName DalamudApiLevel -NotePropertyValue $level -Force

            $stream = $entry.Open()
            $stream.SetLength(0)
            $writer = New-Object System.IO.StreamWriter($stream)
            $writer.Write(($m | ConvertTo-Json -Depth 10))
            $writer.Flush()
            $writer.Dispose()
          } finally {
            $archive.Dispose()
          }

          # Read it back from the zip rather than trusting the write.
          $check = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $e = $check.Entries | Where-Object { $_.Name -eq 'OneTwoPunch.json' } | Select-Object -First 1
            $r = New-Object System.IO.StreamReader($e.Open())
            $packaged = ($r.ReadToEnd() | ConvertFrom-Json).DalamudApiLevel
            $r.Dispose()
          } finally { $check.Dispose() }

          Write-Host "packaged manifest now reports DalamudApiLevel $packaged"
          if ($packaged -ne $level) { throw "packaged manifest says $packaged, expected $level" }

      - name: Generate pluginmaster.json
        shell: pwsh
        run: |
          $zip = Get-ChildItem src/OneTwoPunch.Plugin/bin -Recurse -Filter latest.zip |
                 Select-Object -First 1
          if (-not $zip) { throw "DalamudPackager produced no latest.zip" }
          $out = $zip.Directory.FullName
          Write-Host "Packaged output: $out"
          "PLUGIN_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

          $manifest = Get-Content "$out/OneTwoPunch.json" -Raw | ConvertFrom-Json
          $repo = "https://github.com/${{ github.repository }}"

          # Served as a release asset, which is where the plugins that install without
          # trouble on the reporting machine serve theirs.
          #
          # This was moved to raw.githubusercontent.com on the theory that the release asset
          # redirect chain was what froze the installer. That theory was wrong - HealAssist
          # and BossMod Rewired both serve from releases/latest/download and both install
          # fine on the same machine, and BossMod pulls seventeen megabytes that way. Since
          # the move, this has been the only one of the three on a different host, and the
          # only one that fails.
          $raw = "https://github.com/${{ github.repository }}/releases/latest/download/latest.zip"

          $manifest | Add-Member -NotePropertyName DalamudApiLevel -NotePropertyValue ([int]"${{ steps.apilevel.outputs.level }}") -Force
          $manifest | Add-Member -NotePropertyName TestingDalamudApiLevel -NotePropertyValue ([int]"${{ steps.apilevel.outputs.level }}") -Force
          $icon = "https://raw.githubusercontent.com/${{ github.repository }}/main/assets/icon.png"
          $manifest | Add-Member -NotePropertyName IconUrl -NotePropertyValue $icon -Force
          $manifest | Add-Member -NotePropertyName RepoUrl -NotePropertyValue $repo -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkInstall -NotePropertyValue $raw -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkUpdate -NotePropertyValue $raw -Force
          $manifest | Add-Member -NotePropertyName DownloadLinkTesting -NotePropertyValue $raw -Force
          $manifest | Add-Member -NotePropertyName IsHide -NotePropertyValue $false -Force
          $manifest | Add-Member -NotePropertyName IsTestingExclusive -NotePropertyValue $false -Force
          $manifest | Add-Member -NotePropertyName LastUpdate -NotePropertyValue ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds()) -Force

          ConvertTo-Json @($manifest) -Depth 10 | Set-Content pluginmaster.json -Encoding utf8
          Get-Content pluginmaster.json

      # Dalamud decides whether an update exists by comparing AssemblyVersion, so a new
      # build published under a version that is already live is invisible: the installer
      # offers nothing and the work reaches nobody. That has happened - 1.0.12.0 shipped
      # twice, the second time carrying a merge nobody could install. The version lives in
      # <Version> in the plugin csproj and has to move with the change; failing here is
      # the only way that is noticed at the time rather than a day later.
      - name: Refuse to republish a version that is already live
        shell: pwsh
        run: |
          $new = (Get-Content pluginmaster.json -Raw | ConvertFrom-Json)[0].AssemblyVersion

          $raw = (git show HEAD:pluginmaster.json 2>$null) | Out-String
          if ($LASTEXITCODE -ne 0 -or -not $raw.Trim()) {
            Write-Host "no listing in the repository yet - first publish of $new"
            exit 0
          }

          $previous = ($raw | ConvertFrom-Json)[0].AssemblyVersion
          Write-Host "publishing $new, currently live: $previous"

          if ($new -eq $previous) {
            throw "AssemblyVersion is still $new. Bump <Version> in src/OneTwoPunch.Plugin/OneTwoPunch.Plugin.csproj - Dalamud only offers an update when the version changes, so republishing $new would reach nobody."
          }

      # The listing and the build live in the repository, so installing is a plain file
      # fetch. The GitHub release is still published below as an archive of each build.
      - name: Commit the listing and the build into the repository
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$env:PLUGIN_OUT/latest.zip" dist/latest.zip -Force

          git config user.name "monkdim"
          git config user.email "cdimaggio2@gmail.com"

          git add dist/latest.zip pluginmaster.json
          if (git diff --cached --quiet) {
            Write-Host "Nothing changed."
            exit 0
          }

          $version = (Get-Content pluginmaster.json -Raw | ConvertFrom-Json)[0].AssemblyVersion

          # [skip ci] so publishing does not trigger another publish.
          git commit -m "Publish $version [skip ci]"

          # main moves under long builds; rebase rather than fail the release.
          for ($i = 1; $i -le 4; $i++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "push failed (attempt $i), rebasing onto main"
            git pull --rebase origin main
            Start-Sleep -Seconds ([Math]::Pow(2, $i))
          }

          throw "Could not push the published listing to main"

      # Two separate questions, because conflating them nearly shipped a bad listing.
      #
      # First: is what we just committed internally consistent? The listing and the manifest
      # sealed inside the zip are two copies of the same facts, and Dalamud reads the listing
      # to decide whether to show the plugin and the packaged copy to decide whether to load
      # it. When they disagree the plugin either never appears or appears and refuses to run,
      # with no error either way. This is checked against the files on disk, so no cache or
      # network can flatter it, and it is a hard failure.
      - name: Verify the published files agree with each other
        shell: pwsh
        run: |
          $level = [int]"${{ steps.apilevel.outputs.level }}"
          $listing = (Get-Content pluginmaster.json -Raw | ConvertFrom-Json)[0]

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path dist/latest.zip))
          try {
            $entry = $zip.Entries | Where-Object { $_.Name -eq 'OneTwoPunch.json' } | Select-Object -First 1
            if (-not $entry) { throw "dist/latest.zip contains no OneTwoPunch.json" }
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $packaged = $reader.ReadToEnd() | ConvertFrom-Json
            $reader.Dispose()
          } finally { $zip.Dispose() }

          $problems = @()
          if ($listing.DalamudApiLevel -ne $level)      { $problems += "listing api level $($listing.DalamudApiLevel), expected $level" }
          if ($packaged.DalamudApiLevel -ne $level)     { $problems += "packaged api level $($packaged.DalamudApiLevel), expected $level" }
          if ($listing.AssemblyVersion -ne $packaged.AssemblyVersion) {
            $problems += "listing version $($listing.AssemblyVersion) but packaged version $($packaged.AssemblyVersion)"
          }
          if ($listing.InternalName -ne $packaged.InternalName) {
            $problems += "listing name $($listing.InternalName) but packaged name $($packaged.InternalName)"
          }
          if ($listing.IsHide -eq $true) { $problems += "IsHide is true - the installer would not show it" }

          foreach ($field in 'DownloadLinkInstall','DownloadLinkUpdate','IconUrl') {
            if (-not $listing.$field) { $problems += "$field is empty" }
          }

          if ($problems.Count -gt 0) { throw "Refusing to publish:`n  " + ($problems -join "`n  ") }

          Write-Host "listing and packaged manifest agree: $($listing.InternalName) $($listing.AssemblyVersion), api level $level"

      # Publishing comes before the served-content check now, because the build is served
      # as a release asset: there is nothing at releases/latest/download to check until the
      # release exists. Checking first would have compared against the previous version's
      # asset for ever and never let a new one out.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest build' }}
          files: |
            ${{ env.PLUGIN_OUT }}/latest.zip
            pluginmaster.json
          fail_on_unmatched_files: true

      # Second: is the right content actually being served? Asking only whether the URL
      # answers is what let a run go green while the CDN was still handing out the previous
      # listing - a listing with no api level in it, which is exactly the state that makes
      # the plugin invisible. So fetch the bytes and read them.
      #
      # raw.githubusercontent.com caches for five minutes, so a fresh commit can take that
      # long to appear. The wait is generous for that reason; a timeout here means the
      # listing genuinely is not live and is worth failing over.
      - name: Verify the served listing is the one we just published
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $expected = (Get-Content pluginmaster.json -Raw | ConvertFrom-Json)[0]
          $listingUrl = "https://raw.githubusercontent.com/${{ github.repository }}/main/pluginmaster.json"
          $deadline = (Get-Date).AddMinutes(8)
          $attempt = 0

          Write-Host "expecting $($expected.AssemblyVersion), api level $($expected.DalamudApiLevel), at $listingUrl"

          while ($true) {
            $attempt++
            $served = $null
            try {
              $served = ((Invoke-WebRequest -Uri $listingUrl -UseBasicParsing -ErrorAction Stop).Content |
                          ConvertFrom-Json)[0]
            } catch {
              Write-Host "  attempt ${attempt}: listing not fetchable yet ($_)"
            }

            if ($served -and
                $served.AssemblyVersion -eq $expected.AssemblyVersion -and
                $served.DalamudApiLevel -eq $expected.DalamudApiLevel) {

              # And the build it points at must be the matching one, not a stale zip.
              try {
                $tmp = (New-TemporaryFile).FullName
                Invoke-WebRequest -Uri $served.DownloadLinkInstall -OutFile $tmp -UseBasicParsing -ErrorAction Stop

                $zip = [System.IO.Compression.ZipFile]::OpenRead($tmp)
                try {
                  $e = $zip.Entries | Where-Object { $_.Name -eq 'OneTwoPunch.json' } | Select-Object -First 1
                  $r = New-Object System.IO.StreamReader($e.Open())
                  $servedZip = $r.ReadToEnd() | ConvertFrom-Json
                  $r.Dispose()
                } finally { $zip.Dispose() }

                if ($servedZip.AssemblyVersion -eq $expected.AssemblyVersion) {
                  Write-Host "served listing and served build are both $($expected.AssemblyVersion), api level $($served.DalamudApiLevel)"
                  exit 0
                }

                Write-Host "  attempt ${attempt}: served build is $($servedZip.AssemblyVersion), waiting for $($expected.AssemblyVersion)"
              } catch {
                Write-Host "  attempt ${attempt}: served build not readable yet ($_)"
              }
            } elseif ($served) {
              Write-Host "  attempt ${attempt}: served listing is $($served.AssemblyVersion) / api $($served.DalamudApiLevel), waiting for $($expected.AssemblyVersion) / api $($expected.DalamudApiLevel)"
            }

            if ((Get-Date) -gt $deadline) {
              throw "The published listing is still not being served after $attempt attempts. It is committed, but nobody can install it yet."
            }

            Start-Sleep -Seconds 20
          }
