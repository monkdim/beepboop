name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: Rotation engine (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # TwoButton.Core has no Dalamud dependency on purpose, so the rotation logic is
      # testable without the game. This is where the rotations are actually verified.
      - name: Test
        run: dotnet test tests/TwoButton.Core.Tests/TwoButton.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  plugin:
    name: Plugin (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch Dalamud dev libraries
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath dalamud -Force
        shell: pwsh

      # Which assemblies Dalamud ships moves between versions (ImGui.NET became
      # Dalamud.Bindings.ImGui, for one). Print them so a build failure names the cause.
      - name: List Dalamud assemblies
        run: Get-ChildItem dalamud -Filter *.dll | Select-Object -ExpandProperty Name | Sort-Object
        shell: pwsh

      # Reflect over the Dalamud we are actually building against and print the members of
      # the types this plugin touches. Dalamud's surface moves between versions, and reading
      # it here beats guessing and burning a build.
      - name: Probe Dalamud API surface
        continue-on-error: true
        shell: pwsh
        run: |
          $asm = [System.Reflection.Assembly]::LoadFrom("$PWD/dalamud/Dalamud.dll")
          $wanted = @(
            'IClientState', 'IObjectTable', 'IBattleNpc', 'IGameObject',
            'BattleNpcSubKind', 'IDalamudTextureWrap', 'Status'
          )
          # Every job gauge, so the mapping in GameStateProvider is written against the real
          # member names rather than guessed at one build failure per job.
          $asm.GetTypes() |
            Where-Object { $_.Name -match 'Gauge$' -and $_.Namespace -match 'JobGauge' } |
            ForEach-Object {
              Write-Host "=== $($_.FullName) ==="
              $_.GetProperties() | ForEach-Object {
                Write-Host "  $($_.PropertyType.Name) $($_.Name)"
              }
            }
          foreach ($name in $wanted) {
            $types = $asm.GetTypes() | Where-Object { $_.Name -eq $name }
            foreach ($t in $types) {
              Write-Host "=== $($t.FullName) ==="
              if ($t.IsEnum) {
                [Enum]::GetNames($t) | ForEach-Object { Write-Host "  $_ = $([int][Enum]::Parse($t, $_))" }
                continue
              }
              $t.GetMembers() |
                Where-Object { $_.MemberType -in 'Property', 'Event' } |
                ForEach-Object { Write-Host "  $($_.MemberType) $($_.Name)" }
            }
          }

      # Finding where Dalamud keeps its API level. The release workflow needs this number
      # and cannot guess it - a mismatch makes Dalamud hide the plugin silently - but only
      # a human can trigger a release, so the search happens here where every push runs it.
      - name: Find the Dalamud API level
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "===== dalamud-distrib version metadata ====="
          try {
            $v = Invoke-RestMethod -Uri "https://goatcorp.github.io/dalamud-distrib/version" -TimeoutSec 30
            $v | ConvertTo-Json -Depth 5
          } catch { Write-Host "could not fetch: $_" }

          Write-Host "===== int constants and properties matching /api/ ====="
          Get-ChildItem dalamud -Filter *.dll | ForEach-Object {
            $file = $_
            try { $asm = [System.Reflection.Assembly]::LoadFrom($file.FullName) } catch { return }
            try { $types = $asm.GetTypes() } catch { $types = $_.Exception.Types | Where-Object { $_ } }
            foreach ($t in $types) {
              if (-not $t) { continue }
              try {
                foreach ($f in $t.GetFields('Public,NonPublic,Static,Instance')) {
                  if ($f.Name -match 'api' -and $f.FieldType -eq [int]) {
                    $val = if ($f.IsLiteral) { $f.GetRawConstantValue() } else { '(not a constant)' }
                    Write-Host "$($file.Name)  FIELD  $($t.FullName).$($f.Name) = $val"
                  }
                }
                foreach ($pr in $t.GetProperties('Public,NonPublic,Static,Instance')) {
                  if ($pr.Name -match 'api' -and $pr.PropertyType -eq [int]) {
                    Write-Host "$($file.Name)  PROP   $($t.FullName).$($pr.Name)"
                  }
                }
              } catch { }
            }
          }

          Write-Host "===== any type whose name mentions api ====="
          Get-ChildItem dalamud -Filter Dalamud*.dll | ForEach-Object {
            try { $asm = [System.Reflection.Assembly]::LoadFrom($_.FullName) } catch { return }
            try { $asm.GetTypes() } catch { $_.Exception.Types } |
              Where-Object { $_ -and $_.FullName -match 'api' } |
              ForEach-Object { Write-Host "  TYPE $($_.FullName)" }
          }

      - name: Build
        env:
          DALAMUD_HOME: ${{ github.workspace }}/dalamud
        run: dotnet build src/TwoButton.Plugin/TwoButton.Plugin.csproj -c Release

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem src/TwoButton.Plugin/bin -Recurse | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: TwoButton
          path: src/TwoButton.Plugin/bin/Release/
          if-no-files-found: error
