name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: Rotation engine (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # OneTwoPunch.Core has no Dalamud dependency on purpose, so the rotation logic is
      # testable without the game. This is where the rotations are actually verified.
      - name: Test
        run: dotnet test tests/OneTwoPunch.Core.Tests/OneTwoPunch.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  plugin:
    name: Plugin (build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch Dalamud dev libraries
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Path dalamud.zip -DestinationPath dalamud -Force
        shell: pwsh

      # Which assemblies Dalamud ships moves between versions (ImGui.NET became
      # Dalamud.Bindings.ImGui, for one). Print them so a build failure names the cause.
      - name: List Dalamud assemblies
        run: Get-ChildItem dalamud -Filter *.dll | Select-Object -ExpandProperty Name | Sort-Object
        shell: pwsh

      # Reflect over the Dalamud we are actually building against and print the members of
      # the types this plugin touches. Dalamud's surface moves between versions, and reading
      # it here beats guessing and burning a build.
      - name: Probe Dalamud API surface
        continue-on-error: true
        shell: pwsh
        run: |
          $asm = [System.Reflection.Assembly]::LoadFrom("$PWD/dalamud/Dalamud.dll")
          $wanted = @(
            'IClientState', 'IObjectTable', 'IBattleNpc', 'IGameObject',
            'BattleNpcSubKind', 'IDalamudTextureWrap', 'Status'
          )
          # Every job gauge, so the mapping in GameStateProvider is written against the real
          # member names rather than guessed at one build failure per job.
          $asm.GetTypes() |
            Where-Object { $_.Name -match 'Gauge$' -and $_.Namespace -match 'JobGauge' } |
            ForEach-Object {
              Write-Host "=== $($_.FullName) ==="
              $_.GetProperties() | ForEach-Object {
                Write-Host "  $($_.PropertyType.Name) $($_.Name)"
              }
            }
          foreach ($name in $wanted) {
            $types = $asm.GetTypes() | Where-Object { $_.Name -eq $name }
            foreach ($t in $types) {
              Write-Host "=== $($t.FullName) ==="
              if ($t.IsEnum) {
                [Enum]::GetNames($t) | ForEach-Object { Write-Host "  $_ = $([int][Enum]::Parse($t, $_))" }
                continue
              }
              $t.GetMembers() |
                Where-Object { $_.MemberType -in 'Property', 'Event' } |
                ForEach-Object { Write-Host "  $($_.MemberType) $($_.Name)" }
            }
          }

      # Same derivation the release uses, printed on every push so a Dalamud bump that
      # changes the API level is visible here rather than as a plugin that stops appearing
      # in anyone's installer.
      - name: Report Dalamud API level
        shell: pwsh
        run: |
          $version = [System.Reflection.AssemblyName]::GetAssemblyName((Join-Path $PWD "dalamud/Dalamud.dll")).Version
          Write-Host "Dalamud.dll version $version -> API level $($version.Major)"

      # Dalamud.NET.Sdk resolves its reference assemblies from the XIVLauncher hooks path
      # by default, which is where they live on a real install - so they are unpacked there
      # rather than pointed at with DALAMUD_HOME.
      - name: Stage Dalamud where the SDK looks for it
        shell: pwsh
        run: |
          $hooks = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $hooks | Out-Null
          Copy-Item dalamud/* $hooks -Recurse -Force

      # Create<T> builds an instance of T. Passing the plugin's own type from inside its
      # constructor builds another plugin, and another, for ever - the constructor never
      # returns, and Dalamud builds plugins on the game's frame thread, so the game stops
      # dead with a core pinned and nothing in the log but "Creating plugin instance".
      # That shipped for six releases. It does not get to come back.
      - name: Refuse a self-referential Create<T>
        shell: pwsh
        run: |
          $hits = Select-String -Path src/OneTwoPunch.Plugin/*.cs -Pattern 'Create<\s*Plugin\s*>'
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Line.Trim() }
            throw "Create<Plugin>() inside the plugin constructs itself without end. Use Create<Svc>()."
          }
          Write-Host "no self-referential Create<T>"

      - name: Build
        run: dotnet build src/OneTwoPunch.Plugin/OneTwoPunch.Plugin.csproj -c Release

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem src/OneTwoPunch.Plugin/bin -Recurse | Select-Object -ExpandProperty FullName

      - uses: actions/upload-artifact@v4
        with:
          name: OneTwoPunch
          path: src/OneTwoPunch.Plugin/bin/Release/
          if-no-files-found: error
